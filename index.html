<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login NortShop</title>
    <link rel="stylesheet" href="main.css">
    <script src="main.js" defer></script>
</head>
<body>
    <main>
        <form id="formLogin">
            <h1>Login NortShop</h1>

            <div class="login">
                <label for="emailLogin">Usuário</label>
                <input type="email" id="emailLogin" name="email"
                    placeholder="Digite seu e-mail" required>
            </div>

            <div class="login">
                <label for="senhaLogin">Senha</label>
                <input type="password" id="senhaLogin" name="senha"
                    placeholder="Digite sua senha" required>
            </div>

            <div class="esquecisenha">
                <label>
                    <input type="checkbox" name="lembrar">
                    Lembrar minha senha
                </label>
                <a href="#" id="esqueciSenha">Esqueci minha senha</a>
            </div>

            <button type="submit">Login</button>

            <div class="registrar-se">
                <p>Não tem conta? <a href="cadastro.html">Cadastrar-se</a></p>
            </div>
        </form>
    </main>
</body>
</html>
