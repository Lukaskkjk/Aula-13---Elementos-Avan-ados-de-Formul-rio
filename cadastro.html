<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro NortShop</title>
    <link rel="stylesheet" href="main.css">
    <script src="main.js" defer></script>
</head>
<body>
    <main>
        <form id="formCadastro">
            <h1>Cadastro NortShop</h1>

            <div class="login">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome"
                    placeholder="Digite seu nome" required>
            </div>

            <div class="login">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email"
                    placeholder="Digite seu e-mail" required>
            </div>

            <div class="login">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha"
                    placeholder="Crie uma senha" minlength="6" required>
            </div>

            <div class="login">
                <label for="confirmarSenha">Confirmar senha</label>
                <input type="password" id="confirmarSenha"
                    name="confirmarSenha"
                    placeholder="Digite a senha novamente" required>
            </div>

            <div class="campo">
                <p>Sexo:</p>
                <label>
                    <input type="radio" name="sexo" value="Masculino" required>
                    Masculino
                </label>
                <label>
                    <input type="radio" name="sexo" value="Feminino">
                    Feminino
                </label>
                <label>
                    <input type="radio" name="sexo" value="Outro">
                    Outro
                </label>
            </div>

            <div class="login">
                <label for="cidade">Cidade</label>
                <select id="cidade" name="cidade" required>
                    <option value="">Selecione sua cidade</option>
                    <option value="São Paulo">São Paulo</option>
                    <option value="Campinas">Campinas</option>
                    <option value="Santos">Santos</option>
                    <option value="Outra">Outra</option>
                </select>
            </div>

            <div class="campo">
                <p>Interesses:</p>
                <label>
                    <input type="checkbox" name="interesses" value="Roupas">
                    Roupas
                </label>
                <label>
                    <input type="checkbox" name="interesses" value="Calçados">
                    Calçados
                </label>
                <label>
                    <input type="checkbox" name="interesses" value="Acessórios">
                    Acessórios
                </label>
            </div>

            <div class="login">
                <label for="descricao">Fale um pouco sobre você</label>
                <textarea id="descricao" name="descricao" rows="4"
                    placeholder="Escreva aqui..."></textarea>
            </div>

            <div class="campo">
                <label>
                    <input type="checkbox" id="termos" required>
                    Aceito os termos de cadastro
                </label>
            </div>

            <button type="submit">Cadastrar</button>

            <div class="registrar-se">
                <p>Já tem conta? <a href="index.html">Voltar ao login</a></p>
            </div>
        </form>
    </main>
</body>
</html>
